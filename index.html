<!DOCTYPE html>
<html>
<head>
<title>IKYPANEL VIP</title>

<style>

body{
background:#0b1220;
font-family:sans-serif;
color:white;
margin:0;
display:flex;
justify-content:center;
align-items:flex-start;
padding-top:30px;
}

.container{
width:90%;
max-width:500px;
background:#111827;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

img{
width:100px;
border-radius:50%;
margin-bottom:10px;
}

h2{
color:#a855f7;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:6px 0;
border-radius:8px;
border:none;
background:#1f2937;
color:white;
}

button{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:25px;
font-weight:bold;
color:white;
background:linear-gradient(90deg,#ff4d4d,#7c3aed);
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
border:1px solid #374151;
padding:8px;
}

.hapus{
color:red;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<img src="https://i.imgur.com/4M34hi2.png">

<h2>WELCOME TO IKYPANEL VIP</h2>

<input placeholder="Nama Yang Diinginkan">
<input placeholder="Panel Murni">

<button>Ganti Data</button>

<input id="email" placeholder="Tambah Email">
<input id="result" placeholder="Jumlah Result">

<button onclick="tambah()">Tambahkan</button>

<table>
<thead>
<tr>
<th>Email</th>
<th>Result</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="list"></tbody>
</table>

</div>

<script>

function tambah(){

let email=document.getElementById("email").value;
let result=document.getElementById("result").value;

let row=`
<tr>
<td>${email}</td>
<td>${result}</td>
<td class="hapus" onclick="this.parentElement.remove()">Hapus</td>
</tr>
`;

document.getElementById("list").innerHTML+=row;

}

</script>

</body>
</html>
