<!DOCTYPE html>
<html>
<head>
<title>IKYPANEL VIP</title>

<style>

body{
background:#0b1220;
font-family:sans-serif;
color:white;
text-align:center;
margin:0;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
}

img{
width:110px;
border-radius:50%;
margin-top:20px;
}

h2{
color:#a855f7;
}

input{
width:100%;
padding:12px;
margin:6px 0;
border-radius:8px;
border:none;
background:#1f2937;
color:white;
}

button{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:25px;
font-weight:bold;
color:white;
background:linear-gradient(90deg,#ff4d4d,#7c3aed);
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
background:#111827;
}

th,td{
border:1px solid #374151;
padding:10px;
}

.hapus{
color:red;
cursor:pointer;
}

.music{
background:#10b981;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<img src="https://i.imgur.com/4M34hi2.png">

<h2>WELCOME TO IKYPANEL VIP</h2>

<input placeholder="Nama Yang Diinginkan">

<input placeholder="Panel Murni">

<button>Ganti Data</button>

<h3>Tambah Email</h3>

<input id="email" placeholder="emailkamu@gmail.com">

<input id="result" placeholder="Jumlah Result">

<button onclick="tambah()">Tambahkan</button>

<h3>Daftar Email</h3>

<table>
<thead>
<tr>
<th>Email</th>
<th>Jumlah Result</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="list"></tbody>

</table>

<button class="music" onclick="musik()">🎵 Nyalakan Musik</button>

</div>

<audio id="lagu">
<source src="https://files.catbox.moe/8v7s2x.mp3" type="audio/mp3">
</audio>

<script>

function tambah(){

let email=document.getElementById("email").value;
let result=document.getElementById("result").value;

let row=`
<tr>
<td>${email}</td>
<td>${result}</td>
<td class="hapus" onclick="this.parentElement.remove()">Hapus</td>
</tr>
`;

document.getElementById("list").innerHTML+=row;

}

function musik(){

document.getElementById("lagu").play();

}

</script>

</body>
</html>
